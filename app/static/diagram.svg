  </defs>
  <rect x="24" y="22" width="1232" height="112" rx="12" fill="none" stroke="var(--s1)" stroke-opacity=".35" stroke-dasharray="3 5"/><text x="37" y="39" font-size="10.5" font-weight="700" letter-spacing=".09em" fill="var(--s1)">1 · INTAKE — RUNS IN SINGLE-DIGIT MILLISECONDS</text><g><rect x="44" y="52" width="178" height="62" rx="10" fill="var(--raised)" stroke="var(--s7)" stroke-width="1" stroke-dasharray="5 4"/><rect x="44" y="52" width="4" height="62" rx="2" fill="var(--s7)"/><text x="60" y="73" font-size="13.5" font-weight="600" fill="var(--ink)">Discord message</text><text x="60" y="91" font-size="11.5" fill="var(--ink-2)">your #pricing-errors feed</text><text x="60" y="105" font-size="11.5" fill="var(--ink-2)">POST /api/ingest/message</text></g><g><rect x="262" y="52" width="168" height="62" rx="10" fill="var(--raised)" stroke="var(--axis)" stroke-width="1"/><rect x="262" y="52" width="4" height="62" rx="2" fill="var(--s1)"/><text x="278" y="73" font-size="13.5" font-weight="600" fill="var(--ink)">Extract link</text><text x="278" y="91" font-size="11.5" fill="var(--ink-2)">markdown, &lt;angle&gt;, bare</text><text x="278" y="105" font-size="11.5" fill="var(--ink-2)">strips tracking params</text></g><g><rect x="470" y="52" width="178" height="62" rx="10" fill="var(--raised)" stroke="var(--axis)" stroke-width="1"/><rect x="470" y="52" width="4" height="62" rx="2" fill="var(--s1)"/><text x="486" y="73" font-size="13.5" font-weight="600" fill="var(--ink)">Name it instantly</text><text x="486" y="91" font-size="11.5" fill="var(--ink-2)">product name parsed from</text><text x="486" y="105" font-size="11.5" fill="var(--ink-2)">the URL slug — 0 network</text></g><g><rect x="688" y="52" width="196" height="62" rx="10" fill="var(--raised)" stroke="var(--axis)" stroke-width="1"/><rect x="688" y="52" width="4" height="62" rx="2" fill="var(--s3)"/><text x="704" y="73" font-size="13.5" font-weight="600" fill="var(--ink)">Trust the domain?</text><text x="704" y="91" font-size="11.5" fill="var(--ink-2)">homoglyph · punycode · typo</text><text x="704" y="105" font-size="11.5" fill="var(--ink-2)">subdomain bait · shorteners</text></g><g><rect x="936" y="52" width="152" height="62" rx="10" fill="var(--raised)" stroke="var(--axis)" stroke-width="1"/><rect x="936" y="52" width="4" height="62" rx="2" fill="var(--critical)"/><text x="952" y="73" font-size="13.5" font-weight="600" fill="var(--ink)">BLOCKED</text><text x="952" y="91" font-size="11.5" fill="var(--ink-2)">never fetched,</text><text x="952" y="105" font-size="11.5" fill="var(--ink-2)">logged with the reason</text></g><path d="M222,83.0 L262,83.0" fill="none" stroke="var(--axis)" stroke-width="1.6" marker-end="url(#ah)"/><path d="M430,83.0 L470,83.0" fill="none" stroke="var(--axis)" stroke-width="1.6" marker-end="url(#ah)"/><path d="M648,83.0 L688,83.0" fill="none" stroke="var(--axis)" stroke-width="1.6" marker-end="url(#ah)"/><path d="M884,83.0 L936,83.0" fill="none" stroke="var(--critical)" stroke-width="1.6" marker-end="url(#ah)"/><text x="910.0" y="76.0" font-size="10.5" font-weight="600" text-anchor="middle" fill="var(--muted)">fake</text><text x="1106" y="78" font-size="10.5" font-weight="700" fill="var(--critical)" font-family="var(--mono)">spoof stops here</text><rect x="24" y="150" width="1232" height="268" rx="12" fill="none" stroke="var(--s2)" stroke-opacity=".35" stroke-dasharray="3 5"/><text x="37" y="167" font-size="10.5" font-weight="700" letter-spacing=".09em" fill="var(--s2)">2 · TWO TRACKS AT ONCE — THIS IS WHERE THE SECONDS COME FROM</text><g><rect x="44" y="262" width="58" height="46" rx="23.0" fill="var(--raised)" stroke="var(--axis)" stroke-width="1"/><text x="60" y="289.5" font-size="13.5" font-weight="600" fill="var(--ink)">fork</text></g><path d="M884,83 H73 V262" fill="none" stroke="var(--axis)" stroke-width="1.6" marker-end="url(#ah)"/><text x="128" y="196" font-size="11" font-weight="700" fill="var(--s1)" letter-spacing=".07em">RESEARCH TRACK</text><g><rect x="128" y="206" width="186" height="66" rx="10" fill="var(--raised)" stroke="var(--axis)" stroke-width="1"/><rect x="128" y="206" width="4" height="66" rx="2" fill="var(--s1)"/><text x="144" y="227" font-size="13.5" font-weight="600" fill="var(--ink)">Fetch the page</text><text x="144" y="245" font-size="11.5" fill="var(--ink-2)">JSON-LD → OpenGraph → DOM</text><text x="144" y="259" font-size="11.5" fill="var(--ink-2)">price · stock · final sale</text></g><g><rect x="346" y="206" width="206" height="66" rx="10" fill="var(--raised)" stroke="var(--axis)" stroke-width="1"/><rect x="346" y="206" width="4" height="66" rx="2" fill="var(--s1)"/><text x="362" y="227" font-size="13.5" font-weight="600" fill="var(--ink)">Research it</text><text x="362" y="245" font-size="11.5" fill="var(--ink-2)">category · size · demand</text><text x="362" y="259" font-size="11.5" fill="var(--ink-2)">market comp · return policy</text></g><g><rect x="584" y="206" width="186" height="66" rx="10" fill="var(--raised)" stroke="var(--axis)" stroke-width="1"/><rect x="584" y="206" width="4" height="66" rx="2" fill="var(--s4)"/><text x="600" y="227" font-size="13.5" font-weight="600" fill="var(--ink)">Score vs your filters</text><text x="600" y="245" font-size="11.5" fill="var(--ink-2)">discount · profit · ROI</text><text x="600" y="259" font-size="11.5" fill="var(--ink-2)">demand · returnability</text></g><path d="M102,285.0 L128,239.0" fill="none" stroke="var(--axis)" stroke-width="1.6" marker-end="url(#ah)"/><path d="M314,239.0 L346,239.0" fill="none" stroke="var(--axis)" stroke-width="1.6" marker-end="url(#ah)"/><path d="M552,239.0 L584,239.0" fill="none" stroke="var(--axis)" stroke-width="1.6" marker-end="url(#ah)"/><text x="128" y="316" font-size="11" font-weight="700" fill="var(--s2)" letter-spacing=".07em">CHECKOUT TRACK  (starts before the decision exists)</text><g><rect x="128" y="326" width="186" height="66" rx="10" fill="var(--raised)" stroke="var(--axis)" stroke-width="1"/><rect x="128" y="326" width="4" height="66" rx="2" fill="var(--s2)"/><text x="144" y="347" font-size="13.5" font-weight="600" fill="var(--ink)">Playbook + session</text><text x="144" y="365" font-size="11.5" fill="var(--ink-2)">last night&#x27;s recorded steps;</text><text x="144" y="379" font-size="11.5" fill="var(--ink-2)">still signed in? (saved profile)</text></g><g><rect x="346" y="326" width="206" height="66" rx="10" fill="var(--raised)" stroke="var(--axis)" stroke-width="1"/><rect x="346" y="326" width="4" height="66" rx="2" fill="var(--s2)"/><text x="362" y="347" font-size="13.5" font-weight="600" fill="var(--ink)">Cart + details filled</text><text x="362" y="365" font-size="11.5" fill="var(--ink-2)">add to cart, size, qty,</text><text x="362" y="379" font-size="11.5" fill="var(--ink-2)">address + card entered</text></g><g><rect x="584" y="326" width="186" height="66" rx="10" fill="var(--raised)" stroke="var(--axis)" stroke-width="1"/><rect x="584" y="326" width="4" height="66" rx="2" fill="var(--s2)"/><text x="600" y="347" font-size="13.5" font-weight="600" fill="var(--ink)">Parked at review</text><text x="600" y="365" font-size="11.5" fill="var(--ink-2)">one click from paid,</text><text x="600" y="379" font-size="11.5" fill="var(--ink-2)">nothing charged yet</text></g><path d="M73,308 V359 H128" fill="none" stroke="var(--axis)" stroke-width="1.6" marker-end="url(#ah)"/><path d="M314,359.0 L346,359.0" fill="none" stroke="var(--axis)" stroke-width="1.6" marker-end="url(#ah)"/><path d="M552,359.0 L584,359.0" fill="none" stroke="var(--axis)" stroke-width="1.6" marker-end="url(#ah)"/><g><rect x="812" y="262" width="58" height="46" rx="23.0" fill="var(--raised)" stroke="var(--axis)" stroke-width="1"/><text x="828" y="289.5" font-size="13.5" font-weight="600" fill="var(--ink)">join</text></g><path d="M770,239.0 H812 V285.0" fill="none" stroke="var(--axis)" stroke-width="1.6" marker-end="url(#ah)"/><path d="M770,359.0 H812 V285.0" fill="none" stroke="var(--axis)" stroke-width="1.6" marker-end="url(#ah)"/><text x="900" y="262" font-size="10.5" font-weight="700" fill="var(--muted)" font-family="var(--mono)">BUY  → click it now</text><text x="900" y="284" font-size="10.5" font-weight="700" fill="var(--muted)" font-family="var(--mono)">HOLD → wait for you</text><text x="900" y="306" font-size="10.5" font-weight="700" fill="var(--muted)" font-family="var(--mono)">SKIP → drop the cart</text><rect x="24" y="434" width="1232" height="176" rx="12" fill="none" stroke="var(--s3)" stroke-opacity=".35" stroke-dasharray="3 5"/><text x="37" y="451" font-size="10.5" font-weight="700" letter-spacing=".09em" fill="var(--s3)">3 · PAYING FOR IT</text><g><rect x="44" y="492" width="134" height="80" rx="10" fill="var(--raised)" stroke="var(--axis)" stroke-width="1"/><rect x="44" y="492" width="4" height="80" rx="2" fill="var(--s4)"/><text x="60" y="513" font-size="13.5" font-weight="600" fill="var(--ink)">Decision</text><text x="60" y="531" font-size="11.5" fill="var(--ink-2)">BUY · HOLD</text><text x="60" y="545" font-size="11.5" fill="var(--ink-2)">SKIP · BLOCKED</text></g><g><rect x="202" y="492" width="200" height="80" rx="10" fill="var(--raised)" stroke="var(--axis)" stroke-width="1"/><rect x="202" y="492" width="4" height="80" rx="2" fill="var(--s3)"/><text x="218" y="513" font-size="13.5" font-weight="600" fill="var(--ink)">Pick the card</text><text x="218" y="531" font-size="11.5" fill="var(--ink-2)">your per-site rule order,</text><text x="218" y="545" font-size="11.5" fill="var(--ink-2)">fill one to its limit,</text><text x="218" y="559" font-size="11.5" fill="var(--ink-2)">then roll to the next</text></g><g><rect x="426" y="492" width="178" height="80" rx="10" fill="var(--raised)" stroke="var(--axis)" stroke-width="1"/><rect x="426" y="492" width="4" height="80" rx="2" fill="var(--s3)"/><text x="442" y="513" font-size="13.5" font-weight="600" fill="var(--ink)">Pick shipping</text><text x="442" y="531" font-size="11.5" fill="var(--ink-2)">your per-merchant rule:</text><text x="442" y="545" font-size="11.5" fill="var(--ink-2)">free, expedited, pickup</text><text x="442" y="559" font-size="11.5" fill="var(--ink-2)">— within your cost cap</text></g><g><rect x="628" y="492" width="186" height="80" rx="10" fill="var(--raised)" stroke="var(--axis)" stroke-width="1"/><rect x="628" y="492" width="4" height="80" rx="2" fill="var(--s3)"/><text x="644" y="513" font-size="13.5" font-weight="600" fill="var(--ink)">Place the order</text><text x="644" y="531" font-size="11.5" fill="var(--ink-2)">replays the playbook,</text><text x="644" y="545" font-size="11.5" fill="var(--ink-2)">re-reads the total first</text></g><g><rect x="838" y="492" width="166" height="80" rx="10" fill="var(--raised)" stroke="var(--axis)" stroke-width="1"/><rect x="838" y="492" width="4" height="80" rx="2" fill="var(--s1)"/><text x="854" y="513" font-size="13.5" font-weight="600" fill="var(--ink)">Order recorded</text><text x="854" y="531" font-size="11.5" fill="var(--ink-2)">limit decremented</text><text x="854" y="545" font-size="11.5" fill="var(--ink-2)">console line written</text></g><g><rect x="1028" y="492" width="188" height="80" rx="10" fill="var(--raised)" stroke="var(--axis)" stroke-width="1"/><rect x="1028" y="492" width="4" height="80" rx="2" fill="var(--critical)"/><text x="1044" y="513" font-size="13.5" font-weight="600" fill="var(--ink)">Failed orders</text><text x="1044" y="531" font-size="11.5" fill="var(--ink-2)">stage + reason kept,</text><text x="1044" y="545" font-size="11.5" fill="var(--ink-2)">playbook rolled back</text><text x="1044" y="559" font-size="11.5" fill="var(--ink-2)">if the site changed</text></g><path d="M870,285.0 V532.0 H44" fill="none" stroke="var(--axis)" stroke-width="1.6" marker-end="url(#ah)"/><path d="M178,532.0 L202,532.0" fill="none" stroke="var(--axis)" stroke-width="1.6" marker-end="url(#ah)"/><path d="M402,532.0 L426,532.0" fill="none" stroke="var(--axis)" stroke-width="1.6" marker-end="url(#ah)"/><path d="M604,532.0 L628,532.0" fill="none" stroke="var(--axis)" stroke-width="1.6" marker-end="url(#ah)"/><path d="M814,532.0 L838,532.0" fill="none" stroke="var(--axis)" stroke-width="1.6" marker-end="url(#ah)"/><path d="M721,572 L721,598 L1122,598 L1122,574" fill="none" stroke="var(--critical)" stroke-width="1.6" marker-end="url(#ah)"/><text x="920" y="582" font-size="10.5" font-weight="600" text-anchor="middle" fill="var(--critical)">blocked · out of stock · card declined · price already fixed</text><rect x="24" y="646" width="1232" height="176" rx="12" fill="none" stroke="var(--s7)" stroke-opacity=".35" stroke-dasharray="3 5"/><text x="37" y="663" font-size="10.5" font-weight="700" letter-spacing=".09em" fill="var(--s7)">4 · AFTER THE CLICK</text><g><rect x="44" y="690" width="228" height="76" rx="10" fill="var(--raised)" stroke="var(--axis)" stroke-width="1"/><rect x="44" y="690" width="4" height="76" rx="2" fill="var(--s7)"/><text x="60" y="711" font-size="13.5" font-weight="600" fill="var(--ink)">Shipping status</text><text x="60" y="729" font-size="11.5" fill="var(--ink-2)">carrier · tracking · ETA</text><text x="60" y="743" font-size="11.5" fill="var(--ink-2)">refreshed every few hours</text></g><g><rect x="316" y="690" width="210" height="76" rx="10" fill="var(--raised)" stroke="var(--axis)" stroke-width="1"/><rect x="316" y="690" width="4" height="76" rx="2" fill="var(--s7)"/><text x="332" y="711" font-size="13.5" font-weight="600" fill="var(--ink)">Inventory</text><text x="332" y="729" font-size="11.5" fill="var(--ink-2)">incoming vs delivered,</text><text x="332" y="743" font-size="11.5" fill="var(--ink-2)">cost and market value</text></g><g><rect x="570" y="690" width="196" height="76" rx="10" fill="var(--raised)" stroke="var(--axis)" stroke-width="1"/><rect x="570" y="690" width="4" height="76" rx="2" fill="var(--s1)"/><text x="586" y="711" font-size="13.5" font-weight="600" fill="var(--ink)">Console</text><text x="586" y="729" font-size="11.5" fill="var(--ink-2)">every link, decision,</text><text x="586" y="743" font-size="11.5" fill="var(--ink-2)">and order, with reasons</text></g><path d="M921,572 L921,624 L158,624 L158,688" fill="none" stroke="var(--axis)" stroke-width="1.6" marker-end="url(#ah)"/><path d="M272,728.0 L316,728.0" fill="none" stroke="var(--axis)" stroke-width="1.6" marker-end="url(#ah)"/><path d="M526,728.0 L570,728.0" fill="none" stroke="var(--axis)" stroke-width="1.6" marker-end="url(#ah)"/><g><rect x="1014" y="648" width="200" height="64" rx="10" fill="var(--raised)" stroke="var(--s5)" stroke-width="1" stroke-dasharray="5 4"/><rect x="1014" y="648" width="4" height="64" rx="2" fill="var(--s5)"/><text x="1030" y="669" font-size="13.5" font-weight="600" fill="var(--ink)">Nightly recon task</text><text x="1030" y="687" font-size="11.5" fill="var(--ink-2)">walks each checkout,</text><text x="1030" y="701" font-size="11.5" fill="var(--ink-2)">posts a fresh playbook</text></g><g><rect x="1014" y="722" width="200" height="64" rx="10" fill="var(--raised)" stroke="var(--s5)" stroke-width="1" stroke-dasharray="5 4"/><rect x="1014" y="722" width="4" height="64" rx="2" fill="var(--s5)"/><text x="1030" y="743" font-size="13.5" font-weight="600" fill="var(--ink)">Tracking task</text><text x="1030" y="761" font-size="11.5" fill="var(--ink-2)">reads confirmations,</text><text x="1030" y="775" font-size="11.5" fill="var(--ink-2)">posts status updates</text></g><path d="M1014,680 L994,680 L994,424 L221,424 L221,394" fill="none" stroke="var(--s5)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah5)"/><text x="600" y="418" font-size="10.5" font-weight="600" fill="var(--s5)" text-anchor="middle">playbook JSON → /api/ingest/playbook (nightly, per merchant)</text><path d="M1014,754 L994,754 L994,802 L158,802 L158,768" fill="none" stroke="var(--s5)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah5)"/><text x="576" y="796" font-size="10.5" font-weight="600" fill="var(--s5)" text-anchor="middle">status JSON → /api/ingest/shipping (every few hours)</text>
